<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="820" height="360" viewBox="0 0 820 360">

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0" y1="0" x2="820" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0c1229"/>
      <stop offset="100%" stop-color="#0a0f22"/>
    </linearGradient>

    <!-- Gold Gradient -->
    <linearGradient id="goldGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AD5C"/>
      <stop offset="50%" stop-color="#C49A3C"/>
      <stop offset="100%" stop-color="#B8892E"/>
    </linearGradient>

    <!-- Blue Glow Gradient -->
    <radialGradient id="blueGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3366ff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3366ff" stop-opacity="0"/>
    </radialGradient>

    <!-- Gold Glow Gradient -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C49A3C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#C49A3C" stop-opacity="0"/>
    </radialGradient>

    <!-- Bar chart gradient -->
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#1a44f5"/>
      <stop offset="100%" stop-color="#598dff"/>
    </linearGradient>

    <!-- Gold bar gradient -->
    <linearGradient id="barGradGold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#B8892E"/>
      <stop offset="100%" stop-color="#D4AD5C"/>
    </linearGradient>

    <!-- Accent line gradient -->
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C49A3C" stop-opacity="0"/>
      <stop offset="30%" stop-color="#C49A3C" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#3366ff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3366ff" stop-opacity="0"/>
    </linearGradient>

    <!-- Horizontal fade for side elements -->
    <linearGradient id="fadeLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="fadeRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Vignette gradients -->
    <linearGradient id="topFadeDown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="100%" stop-color="#080d1a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFadeUp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080d1a" stop-opacity="0"/>
      <stop offset="100%" stop-color="#080d1a"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="gridPattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
    </pattern>

    <!-- Dot pattern -->
    <pattern id="dotPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="0.6" fill="rgba(255,255,255,0.04)"/>
    </pattern>

    <!-- Clip for rounded cards -->
    <clipPath id="cardClip1">
      <rect x="0" y="0" width="120" height="70" rx="8"/>
    </clipPath>
  </defs>

  <!-- ============================================ -->
  <!-- LAYER: Background                            -->
  <!-- ============================================ -->
  <g id="Background">
    <rect width="820" height="360" fill="url(#bgGradient)"/>
    <rect width="820" height="360" fill="url(#gridPattern)"/>
    <rect width="820" height="360" fill="url(#dotPattern)"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER: Ambient Glow Effects                  -->
  <!-- ============================================ -->
  <g id="Ambient-Glows" opacity="1">
    <!-- Main blue glow center-right -->
    <ellipse cx="500" cy="180" rx="300" ry="200" fill="url(#blueGlow)"/>
    <!-- Gold glow center-left -->
    <ellipse cx="320" cy="180" rx="250" ry="180" fill="url(#goldGlow)"/>
    <!-- Subtle top edge glow -->
    <rect x="200" y="-20" width="420" height="40" rx="20" fill="#3366ff" opacity="0.03"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER: Desktop Side Elements (Left)          -->
  <!-- Visible on desktop, cropped on mobile        -->
  <!-- ============================================ -->
  <g id="Desktop-Left-Elements" opacity="0.7">
    <!-- Floating mini dashboard card - left -->
    <g transform="translate(15, 55)">
      <rect width="95" height="60" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
      <text x="10" y="18" font-family="Inter, system-ui, sans-serif" font-size="6" fill="rgba(255,255,255,0.3)" font-weight="500">LEADS</text>
      <text x="10" y="35" font-family="Inter, system-ui, sans-serif" font-size="14" fill="rgba(255,255,255,0.5)" font-weight="700">1,247</text>
      <text x="10" y="48" font-family="Inter, system-ui, sans-serif" font-size="6" fill="#4ade80" font-weight="500">+12.5%</text>
      <!-- Mini sparkline -->
      <polyline points="55,42 60,38 65,40 70,35 75,37 80,30 85,28" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.5"/>
    </g>

    <!-- Geometric hexagon -->
    <g transform="translate(40, 165)">
      <polygon points="15,0 30,8.6 30,25.9 15,34.6 0,25.9 0,8.6" fill="none" stroke="rgba(196,154,60,0.15)" stroke-width="0.7"/>
    </g>

    <!-- Vertical data bars left edge -->
    <g transform="translate(8, 230)" opacity="0.4">
      <rect x="0" y="25" width="5" height="35" rx="2" fill="url(#barGrad)" opacity="0.3"/>
      <rect x="9" y="15" width="5" height="45" rx="2" fill="url(#barGrad)" opacity="0.4"/>
      <rect x="18" y="20" width="5" height="40" rx="2" fill="url(#barGradGold)" opacity="0.3"/>
      <rect x="27" y="8" width="5" height="52" rx="2" fill="url(#barGrad)" opacity="0.5"/>
      <rect x="36" y="12" width="5" height="48" rx="2" fill="url(#barGradGold)" opacity="0.4"/>
    </g>

    <!-- Connection nodes -->
    <circle cx="70" cy="290" r="3" fill="rgba(51,102,255,0.2)" stroke="rgba(51,102,255,0.3)" stroke-width="0.5"/>
    <circle cx="45" cy="310" r="2" fill="rgba(196,154,60,0.2)" stroke="rgba(196,154,60,0.3)" stroke-width="0.5"/>
    <line x1="70" y1="290" x2="45" y2="310" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER: Desktop Side Elements (Right)         -->
  <!-- Visible on desktop, cropped on mobile        -->
  <!-- ============================================ -->
  <g id="Desktop-Right-Elements" opacity="0.7">
    <!-- Floating card - conversion funnel -->
    <g transform="translate(738, 45)">
      <rect width="72" height="80" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
      <text x="10" y="18" font-family="Inter, system-ui, sans-serif" font-size="5.5" fill="rgba(255,255,255,0.3)" font-weight="500" letter-spacing="0.5">FUNNEL</text>
      <!-- Mini funnel bars -->
      <rect x="10" y="28" width="52" height="7" rx="2" fill="url(#barGrad)" opacity="0.4"/>
      <rect x="15" y="39" width="42" height="7" rx="2" fill="url(#barGrad)" opacity="0.5"/>
      <rect x="20" y="50" width="32" height="7" rx="2" fill="url(#barGradGold)" opacity="0.5"/>
      <rect x="25" y="61" width="22" height="7" rx="2" fill="url(#barGradGold)" opacity="0.6"/>
    </g>

    <!-- Geometric triangle -->
    <g transform="translate(755, 175)" opacity="0.2">
      <polygon points="20,0 40,35 0,35" fill="none" stroke="#3366ff" stroke-width="0.7"/>
    </g>

    <!-- Mini line chart -->
    <g transform="translate(740, 240)" opacity="0.5">
      <rect width="70" height="50" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
      <polyline points="8,38 18,30 28,33 38,22 48,25 58,15" fill="none" stroke="#C49A3C" stroke-width="1.2" opacity="0.6"/>
      <polyline points="8,40 18,35 28,37 38,28 48,30 58,20" fill="none" stroke="#3366ff" stroke-width="1.2" opacity="0.4"/>
    </g>

    <!-- Scattered dots -->
    <circle cx="770" cy="155" r="2" fill="rgba(196,154,60,0.25)"/>
    <circle cx="800" cy="330" r="2.5" fill="rgba(51,102,255,0.2)"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER: Decorative Elements (Safe Zone)       -->
  <!-- ============================================ -->
  <g id="Decorative-Elements">
    <!-- Horizontal accent line across center -->
    <line x1="140" y1="248" x2="680" y2="248" stroke="url(#accentLine)" stroke-width="0.5"/>

    <!-- Floating dashboard card - top left of safe zone -->
    <g transform="translate(115, 42)" opacity="0.55">
      <rect width="110" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
      <text x="12" y="20" font-family="Inter, system-ui, sans-serif" font-size="6" fill="rgba(255,255,255,0.35)" font-weight="500" letter-spacing="0.5">REVENUE</text>
      <text x="12" y="38" font-family="Inter, system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.55)" font-weight="700">$84.2K</text>
      <text x="12" y="52" font-family="Inter, system-ui, sans-serif" font-size="7" fill="#4ade80" font-weight="600">+22.1% ↑</text>
      <!-- Mini bar chart -->
      <g transform="translate(75, 20)">
        <rect x="0" y="18" width="4" height="14" rx="1" fill="url(#barGrad)" opacity="0.5"/>
        <rect x="7" y="12" width="4" height="20" rx="1" fill="url(#barGrad)" opacity="0.6"/>
        <rect x="14" y="6" width="4" height="26" rx="1" fill="url(#barGradGold)" opacity="0.7"/>
        <rect x="21" y="2" width="4" height="30" rx="1" fill="url(#barGradGold)" opacity="0.8"/>
      </g>
    </g>

    <!-- Floating card - top right of safe zone -->
    <g transform="translate(598, 42)" opacity="0.55">
      <rect width="110" height="65" rx="8" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
      <text x="12" y="20" font-family="Inter, system-ui, sans-serif" font-size="6" fill="rgba(255,255,255,0.35)" font-weight="500" letter-spacing="0.5">CAMPAIGNS</text>
      <text x="12" y="38" font-family="Inter, system-ui, sans-serif" font-size="15" fill="rgba(255,255,255,0.55)" font-weight="700">12</text>
      <text x="40" y="38" font-family="Inter, system-ui, sans-serif" font-size="8" fill="rgba(255,255,255,0.3)" font-weight="400">active</text>
      <!-- Status dots -->
      <circle cx="15" cy="52" r="3" fill="#4ade80" opacity="0.5"/>
      <text x="22" y="55" font-family="Inter, system-ui, sans-serif" font-size="6" fill="rgba(255,255,255,0.3)">3 automated</text>
      <!-- Ring chart -->
      <g transform="translate(82, 25)">
        <circle cx="14" cy="14" r="12" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="3"/>
        <circle cx="14" cy="14" r="12" fill="none" stroke="#3366ff" stroke-width="3" stroke-dasharray="54 21.5" stroke-dashoffset="18.9" opacity="0.6"/>
        <circle cx="14" cy="14" r="12" fill="none" stroke="#C49A3C" stroke-width="3" stroke-dasharray="18 57.5" stroke-dashoffset="18.9" opacity="0.6" transform="rotate(-70, 14, 14)"/>
      </g>
    </g>

    <!-- Growth trend line across background -->
    <g opacity="0.12">
      <polyline
        points="130,300 180,285 230,290 280,260 330,265 380,230 430,235 480,200 530,190 580,160 630,155 680,130"
        fill="none" stroke="#C49A3C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Glow version -->
      <polyline
        points="130,300 180,285 230,290 280,260 330,265 380,230 430,235 480,200 530,190 580,160 630,155 680,130"
        fill="none" stroke="#C49A3C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.3" filter="url(#blur)"/>
    </g>

    <!-- Geometric accents -->
    <g opacity="0.15">
      <!-- Diamond shape left -->
      <rect x="120" y="270" width="16" height="16" rx="2" transform="rotate(45, 128, 278)" fill="none" stroke="#C49A3C" stroke-width="0.7"/>
      <!-- Diamond shape right -->
      <rect x="680" y="270" width="12" height="12" rx="1" transform="rotate(45, 686, 276)" fill="none" stroke="#3366ff" stroke-width="0.7"/>
      <!-- Circle -->
      <circle cx="160" cy="140" r="20" fill="none" stroke="#3366ff" stroke-width="0.5"/>
      <circle cx="160" cy="140" r="14" fill="none" stroke="#3366ff" stroke-width="0.3" stroke-dasharray="3 3"/>
      <!-- Circle right -->
      <circle cx="665" cy="160" r="18" fill="none" stroke="#C49A3C" stroke-width="0.5"/>
    </g>

    <!-- Floating connection nodes & lines -->
    <g opacity="0.2">
      <circle cx="200" cy="310" r="2.5" fill="#3366ff"/>
      <circle cx="260" cy="320" r="2" fill="#C49A3C"/>
      <circle cx="560" cy="310" r="2" fill="#C49A3C"/>
      <circle cx="620" cy="320" r="2.5" fill="#3366ff"/>
      <line x1="200" y1="310" x2="260" y2="320" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
      <line x1="560" y1="310" x2="620" y2="320" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- LAYER: Main Content (Center Safe Zone)       -->
  <!-- Safe for both desktop & mobile               -->
  <!-- ============================================ -->
  <g id="Main-Content">

    <!-- Logo Mark - Geometric Cube -->
    <g id="Logo-Mark" transform="translate(315, 102)">
      <!-- Outer cube structure -->
      <!-- Left face (gold) -->
      <polygon points="0,28 38,8 38,80 0,100" fill="url(#goldGradient)"/>
      <!-- Right/front face (navy) -->
      <polygon points="38,8 90,28 90,100 38,80" fill="#1E2455"/>
      <!-- Top face (navy lighter) -->
      <polygon points="0,28 38,8 90,28 52,48" fill="#252B6A"/>

      <!-- Front face details - window/door cutouts -->
      <polygon points="50,35 72,44 72,72 50,63" fill="#0c1229"/>
      <polygon points="42,40 48,37 48,60 42,63" fill="#0c1229"/>

      <!-- Structural beam at top -->
      <line x1="20" y1="18" x2="70" y2="18" stroke="#252B6A" stroke-width="2.5" opacity="0.5"/>

      <!-- Small square detail -->
      <rect x="56" y="42" width="5" height="5" fill="#0c1229" opacity="0.7"/>

      <!-- Left face detail lines -->
      <line x1="12" y1="45" x2="12" y2="80" stroke="#B8892E" stroke-width="1" opacity="0.3"/>
      <line x1="25" y1="38" x2="25" y2="73" stroke="#B8892E" stroke-width="1" opacity="0.3"/>
    </g>

    <!-- Brand Name -->
    <g id="Brand-Text" transform="translate(410, 120)">
      <text x="0" y="30" font-family="Inter, system-ui, sans-serif" font-size="32" fill="white" font-weight="800" letter-spacing="-0.5">
        FULLSTACK
      </text>
      <text x="0" y="65" font-family="Inter, system-ui, sans-serif" font-size="32" fill="white" font-weight="800" letter-spacing="-0.5">
        <tspan fill="#C49A3C">GROWTH</tspan>
      </text>
    </g>

    <!-- Tagline -->
    <g id="Tagline">
      <text x="410" y="218" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="rgba(255,255,255,0.55)" font-weight="400" letter-spacing="0.8">
        CRM · Marketing · Advertising
      </text>
      <text x="410" y="236" font-family="Inter, system-ui, sans-serif" font-size="12.5" fill="rgba(255,255,255,0.55)" font-weight="400" letter-spacing="0.8">
        All in One Platform
      </text>
    </g>

    <!-- Accent underline below tagline -->
    <g id="Accent-Underline">
      <line x1="410" y1="248" x2="505" y2="248" stroke="#C49A3C" stroke-width="1.5" opacity="0.5"/>
      <line x1="508" y1="248" x2="560" y2="248" stroke="#3366ff" stroke-width="1.5" opacity="0.4"/>
    </g>

    <!-- Bottom tagline / CTA hint -->
    <g id="CTA-Hint">
      <text x="410" y="290" font-family="Inter, system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.35)" font-weight="500" letter-spacing="2">
        BOOK YOUR FREE CONSULTATION
      </text>
      <!-- Arrow -->
      <g transform="translate(607, 282)" opacity="0.35">
        <line x1="0" y1="4" x2="12" y2="4" stroke="white" stroke-width="1"/>
        <polyline points="8,0 12,4 8,8" fill="none" stroke="white" stroke-width="1"/>
      </g>
    </g>

    <!-- Trust indicators -->
    <g id="Trust-Badges" opacity="0.3">
      <g transform="translate(315, 316)">
        <circle cx="4" cy="4" r="2.5" fill="#4ade80"/>
        <text x="12" y="7" font-family="Inter, system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.5)" font-weight="500">500+ Businesses</text>
      </g>
      <g transform="translate(440, 316)">
        <circle cx="4" cy="4" r="2.5" fill="#4ade80"/>
        <text x="12" y="7" font-family="Inter, system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.5)" font-weight="500">98% Satisfaction</text>
      </g>
      <g transform="translate(565, 316)">
        <circle cx="4" cy="4" r="2.5" fill="#4ade80"/>
        <text x="12" y="7" font-family="Inter, system-ui, sans-serif" font-size="7" fill="rgba(255,255,255,0.5)" font-weight="500">3.2x Avg. ROI</text>
      </g>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- LAYER: Vignette / Edge Treatment             -->
  <!-- ============================================ -->
  <g id="Vignette">
    <!-- Top fade -->
    <rect x="0" y="0" width="820" height="40" fill="url(#topFadeDown)" opacity="0.5"/>
    <!-- Bottom fade -->
    <rect x="0" y="320" width="820" height="40" fill="url(#bottomFadeUp)" opacity="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- LAYER: Safe Zone Guides (hidden by default)  -->
  <!-- Unhide in Illustrator for reference          -->
  <!-- ============================================ -->
  <g id="Safe-Zone-Guides" display="none">
    <!-- Mobile crop area -->
    <rect x="90" y="0" width="640" height="360" fill="none" stroke="#ff0000" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.5"/>
    <!-- Desktop crop area -->
    <rect x="0" y="24" width="820" height="312" fill="none" stroke="#00ff00" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.5"/>
    <!-- Combined safe zone -->
    <rect x="90" y="24" width="640" height="312" fill="none" stroke="#ffff00" stroke-width="1" stroke-dasharray="4 4" opacity="0.7"/>
    <!-- Profile picture overlap zone (mobile) -->
    <rect x="0" y="260" width="180" height="100" fill="#ff0000" opacity="0.1"/>
  </g>

</svg>
